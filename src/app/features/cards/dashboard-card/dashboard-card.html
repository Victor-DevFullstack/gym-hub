<mat-card>
  <div class="div-title">
    <img src="{{ src }}" alt="{{ titulo }}" width="50" height="50" class="{{ classImg }}" />
    <mat-card-title class="{{ classtitulo }}">{{ titulo }}</mat-card-title>
  </div>
  <div class="div-subtitle">
    <span id="conteudo" class="{{ classsubtitle }}">{{ conteudo }}</span>
    <span class="{{ classSubtitle2 }}">{{ subConteudo }}</span>
  </div>
</mat-card>
