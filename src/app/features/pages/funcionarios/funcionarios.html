<section class="top-dashboard">
  <section class="dashboard-title">
    <h2>Recepcionistas</h2>
    <p>Contas de recepção da academia</p>
  </section>

  <button mat-flat-button (click)="abrirDialog()">Adicionar Recepcionista</button>
</section>

<section class="funcionarios">
  <mat-form-field>
    <mat-label>Filtro</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Maria" #input />
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" class="mat-shadow-2">
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let element">{{ element.nome }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Cargo</th>
      <td mat-cell *matCellDef="let element">{{ element.role | titlecase }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let element">{{ element.email }}</td>
    </ng-container>

    <ng-container matColumnDef="editar">
      <th class="edit" mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element">
        <button matButton="outlined" (click)="abrirDialog(element)">Editar</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">Sem resultados para "{{ input.value }}"</td>
    </tr>
  </table>
</section>
