<section class="top-dashboard">
  <section class="dashboard-title">
    <h2>Carteira</h2>
    <p>Resumo financeiro da academia</p>
  </section>
</section>

<section class="dashboard-container">
  <app-dashboard-card
    titulo="Receita mensal"
    classtitulo="title1"
    classsubtitle="subtitle-black"
    conteudo="{{ receitaMensal() }}"
    src="/icons/cash-stack.svg"
    classImg="card-icon"
  />
  <app-dashboard-card
    titulo="Alunos em dia"
    classtitulo="title2"
    classsubtitle="subtitle2"
    conteudo="{{ totalPagos() }}"
    src="/icons/people-blue.svg"
    classImg="card-icon"
  />
  <app-dashboard-card
    titulo="Pendentes"
    classtitulo="title3"
    classsubtitle="subtitle3"
    conteudo="{{ totalPendentes() }}"
    src="/icons/wallet.svg"
    classImg="card-icon"
  />
  <app-dashboard-card
    titulo="Inadimplência"
    classtitulo="title4"
    classsubtitle="subtitle4"
    conteudo="{{ totalAtrasados() }}"
    subTexto="{{ taxaInadimplencia() }} dos alunos"
    src="/icons/arrow-repeat.svg"
    classImg="card-icon"
  />
</section>

<section class="carteira-table">
  <mat-form-field>
    <mat-label>Filtro</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Maria" #input />
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" class="mat-shadow-2">
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef class="th-inicio">Nome</th>
      <td mat-cell *matCellDef="let element">{{ element.nome }}</td>
    </ng-container>

    <ng-container matColumnDef="plano">
      <th mat-header-cell *matHeaderCellDef>Plano</th>
      <td mat-cell *matCellDef="let element">{{ element.plano | titlecase }}</td>
    </ng-container>

    <ng-container matColumnDef="valor">
      <th mat-header-cell *matHeaderCellDef>Valor</th>
      <td mat-cell *matCellDef="let element">{{ getValor(element) }}</td>
    </ng-container>

    <ng-container matColumnDef="vencimento">
      <th mat-header-cell *matHeaderCellDef>Vencimento</th>
      <td mat-cell *matCellDef="let element">{{ getVencimento(element) }}</td>
    </ng-container>

    <ng-container matColumnDef="status" class="th-fim">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let element" [class]="'status-' + getStatus(element).toLowerCase()">
        {{ getStatus(element) }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="5">Sem resultados para "{{ input.value }}"</td>
    </tr>
  </table>
</section>
