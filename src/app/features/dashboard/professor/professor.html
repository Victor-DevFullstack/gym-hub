<section class="top-dashboard">
  <section class="dashboard-title">
    <h2>Alunos</h2>
    <p></p>
  </section>
  </section>

<section class="professor">
  <table mat-table [dataSource]="dataSource" class="mat-shadow-2">
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef class="th-inicio">Nome</th>
      <td mat-cell *matCellDef="let element">{{ element.nome }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let element">{{ element.email }}</td>
    </ng-container>

    <ng-container matColumnDef="editar">
      <th class="edit" mat-header-cell *matHeaderCellDef class="th-fim"></th>
      <td mat-cell *matCellDef="let element">
        <button matButton="outlined" (click)="abrirDialog(element)">Editar</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  </table>
</section>
