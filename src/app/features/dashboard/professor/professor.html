<section class="top-dashboard">
  <section class="dashboard-title">
    <h2>Alunos</h2>
    <p></p>
  </section>
  </section>

<section class="professor">
  <table mat-table [dataSource]="dataSource" class="mat-shadow-2">
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef class="th-inicio">Nome</th>
      <td mat-cell *matCellDef="let element">{{ element.nome }}</td>
    </ng-container>

    <ng-container matColumnDef="plano">
      <th mat-header-cell *matHeaderCellDef>Plano</th>
      <td mat-cell *matCellDef="let element">{{ element.plano ? `Plano ${(element.plano | titlecase)}` : 'Sem plano' }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let element">{{ element.status }}</td>
    </ng-container>

    <ng-container matColumnDef="treino">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element">
        <a mat-button [routerLink]="['/dashboard/treino', element.id]">Montar treino</a>
      </td>
    </ng-container>

    <ng-container matColumnDef="editar">
      <th class="edit" mat-header-cell *matHeaderCellDef class="th-fim"></th>
      <td mat-cell *matCellDef="let element">
        <button matButton="outlined" (click)="abrirDialog(element)">Ver</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  </table>
</section>
