<h2 mat-dialog-title>{{ titulo }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="exercicio-form">
    <mat-form-field appearance="outline">
      <mat-label>Nome do exercício</mat-label>
      <input matInput formControlName="nome" placeholder="Ex. Supino reto" />
    </mat-form-field>

    <section class="exercicio-form-row">
      <mat-form-field appearance="outline">
        <mat-label>Séries</mat-label>
        <input matInput type="number" formControlName="series" min="1" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Repetições</mat-label>
        <input matInput type="number" formControlName="repeticoes" min="1" />
      </mat-form-field>
    </section>

    <mat-form-field appearance="outline">
      <mat-label>Carga</mat-label>
      <input matInput formControlName="carga" placeholder="Ex. 20kg ou peso corporal" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Observações</mat-label>
      <input matInput formControlName="observacoes" placeholder="Ex. 3 aquecimento + 3 séries válidas" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]>Cancelar</button>
  <button mat-flat-button (click)="salvar()">Salvar</button>
</mat-dialog-actions>
