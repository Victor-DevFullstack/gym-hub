<header class="header">
  <section class="left"><span>Academia <strong>{{user?.nomeAcademia}}</strong></span></section>
  <section class="center">
    <div class="header-search"> 
      <input
        type="text"
        placeholder="Buscar..."
      />
    </div>
  </section>

  <section class="right">
    <button class="notification">
      <img src="/icons/bell.svg" alt="Notificações" class="bell-icon" />
    </button>

    <a routerLink="configuracoes" class="link">
      <div class="profile">
        <div class="profile-letter">
          {{user?.nome?.slice(0,1)}}
      
        </div>

        <div class="profile-info">
          <span class="profile-name">
            {{user?.nome}}
          </span>
          <span class="profile-role">
            {{user?.role | titlecase}}
          </span>
        </div>
      </div>
    </a>
  </section>

</header>
