<section class="container">
  <mat-card>
    <mat-card-content>
      <h2>Faturamento e assinatura</h2>

      @if (aluno) {
        <div class="plano-atual">
          <mat-icon color="primary">check_circle</mat-icon>
          <div>
            <span class="label">Plano atual</span>
            <p class="plano-nome">{{ nomePlano }}</p>
            <span class="vencimento">Vence em {{ vencimento }} · {{ status }}</span>
          </div>
        </div>

        <table mat-table [dataSource]="historico">
          <ng-container matColumnDef="data">
            <th mat-header-cell *matHeaderCellDef>Data</th>
            <td mat-cell *matCellDef="let item">{{ item.data }}</td>
          </ng-container>

          <ng-container matColumnDef="descricao">
            <th mat-header-cell *matHeaderCellDef>Descrição</th>
            <td mat-cell *matCellDef="let item">{{ item.descricao }}</td>
          </ng-container>

          <ng-container matColumnDef="valor">
            <th mat-header-cell *matHeaderCellDef>Valor</th>
            <td mat-cell *matCellDef="let item">{{ item.valor }}</td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let item">{{ item.status }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>

        <button mat-stroked-button color="warn" (click)="atualizarPagamento()">
          Atualizar forma de pagamento
        </button>
      } @else {
        <p>Este tipo de conta não possui informações de faturamento.</p>
      }
    </mat-card-content>
  </mat-card>
</section>
